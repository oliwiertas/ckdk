<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Ultimate MC GUI Creator 3D-Look</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('https://db.onlinewebfonts.com/t/6ab539bc7211ab9f109033333e65922c.woff2') format('woff2');
        }

        body {
            background-color: #333;
            color: #fff;
            font-family: 'Minecraft', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Stylizacja Kontenera GUI na wzór MC */
        .gui-wrapper {
            background-color: #c6c6c6;
            border: 3px solid #ffffff;
            border-right-color: #555;
            border-bottom-color: #555;
            padding: 10px;
            image-rendering: pixelated;
            box-shadow: 5px 5px 0px #000;
        }

        .gui-header {
            color: #3f3f3f;
            margin-bottom: 10px;
            font-size: 20px;
            text-shadow: none;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(9, 36px);
            gap: 0;
            border: 2px solid #373737;
            background-color: #8b8b8b;
        }

        .slot {
            width: 36px;
            height: 36px;
            border: 2px solid #373737;
            border-top-color: #373737;
            border-left-color: #373737;
            border-right-color: #fff;
            border-bottom-color: #fff;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .slot:hover {
            background-color: rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }

        .slot.selected {
            background-color: rgba(0, 255, 0, 0.2);
            outline: 2px solid #00ff00;
            z-index: 10;
        }

        .slot img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        /* Panel Edycji */
        .editor-panel {
            margin-top: 20px;
            background: #222;
            padding: 20px;
            border: 2px solid #555;
            width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .item-list {
            height: 250px;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .item-asset {
            cursor: pointer;
            padding: 5px;
            border: 1px solid transparent;
            text-align: center;
        }

        .item-asset:hover {
            border-color: #fff;
            background: #333;
        }

        .item-asset img { width: 32px; }
