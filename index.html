<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>OliwierTAS 3D Pickaxe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05000d;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas#three { display: block; }
  #ui {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 100;
  }
  .btn {
    padding: 8px 20px;
    background: rgba(120,0,200,0.25);
    border: 1px solid rgba(200,50,255,0.4);
    color: rgba(220,150,255,0.85);
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all .2s;
    backdrop-filter: blur(6px);
  }
  .btn:hover { background: rgba(180,0,255,0.35); border-color: rgba(255,80,255,0.7); color:#fff; }
  #watermark {
    position: fixed;
    top: 22px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(180,60,255,0.35);
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="watermark">OliwierTAS &nbsp;\u00b7&nbsp; BoxPvP</div>
<canvas id="three"></canvas>
<div id="ui">
  <button class="btn" id="btnSpin">\u27f3 Auto Spin</button>
  <button class="btn" id="btnReset">\u21ba Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// \u2500\u2500\u2500 SCENE SETUP \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three'), antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W/H, 0.01, 100);
camera.position.set(0, 1.2, 7);
camera.lookAt(0, 0, 0);

// \u2500\u2500\u2500 BACKGROUND GRADIENT via CSS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
document.body.style.background = 'radial-gradient(ellipse at 40% 40%, #1a0030 0%, #0a0018 50%, #03000a 100%)';

// \u2500\u2500\u2500 LIGHTS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const ambLight = new THREE.AmbientLight(0x220033, 1.8);
scene.add(ambLight);

const mainLight = new THREE.DirectionalLight(0xdd66ff, 3.5);
mainLight.position.set(4, 6, 5);
mainLight.castShadow = true;
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0xff00aa, 1.8);
fillLight.position.set(-4, 2, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x8800ff, 2.2);
rimLight.position.set(0, -3, -5);
scene.add(rimLight);

const pointGlow = new THREE.PointLight(0xff00cc, 4, 8);
pointGlow.position.set(-1, 1, 3);
scene.add(pointGlow);

// \u2500\u2500\u2500 MATERIALS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function metalMat(color, emissive = 0x000000, roughness = 0.18, metalness = 0.85) {
  return new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity: 0.35,
    roughness, metalness,
    envMapIntensity: 1.2
  });
}

// Gradient g\u0142\u00f3wny fiolet\u2192magenta przez VertexColors
function gradientMat() {
  return new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.15,
    metalness: 0.9,
    envMapIntensity: 1.5,
  });
}

// Maluje wierzcho\u0142ki gradientem
function paintGradient(geo, colorA, colorB, axis = 'y') {
  const positions = geo.attributes.position;
  const colors = [];
  const cA = new THREE.Color(colorA);
  const cB = new THREE.Color(colorB);

  // znajd\u017a min/max na osi
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < positions.count; i++) {
    const v = axis === 'x' ? positions.getX(i) : axis === 'y' ? positions.getY(i) : positions.getZ(i);
    min = Math.min(min, v); max = Math.max(max, v);
  }
  for (let i = 0; i < positions.count; i++) {
    const v = axis === 'x' ? positions.getX(i) : axis === 'y' ? positions.getY(i) : positions.getZ(i);
    const t = (v - min) / (max - min + 0.0001);
    const c = cA.clone().lerp(cB, t);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
}

const matHead = gradientMat();
const matStick = new THREE.MeshStandardMaterial({
  color: 0x2a0845, roughness: 0.4, metalness: 0.6,
  emissive: 0x110022, emissiveIntensity: 0.2
});
const matEdge = new THREE.MeshStandardMaterial({
  color: 0xff00cc, emissive: 0xff00cc, emissiveIntensity: 0.6,
  roughness: 0.05, metalness: 1.0
});

// \u2500\u2500\u2500 PICKAXE GROUP \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const pickaxe = new THREE.Group();
scene.add(pickaxe);

// Skalowanie ca\u0142o\u015bci \u2014 1 jednostka = ~wygodny rozmiar
const S = 1.0;

// \u2500\u2500 HELPER: box z gradientem \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function makeBox(w, h, d, cx, cy, cz, colorA, colorB, gradAxis = 'x') {
  const geo = new THREE.BoxGeometry(w, h, d, 2, 2, 2);
  paintGradient(geo, colorA, colorB, gradAxis);
  const mesh = new THREE.Mesh(geo, gradientMat());
  mesh.position.set(cx, cy, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  pickaxe.add(mesh);
  return mesh;
}

// \u2500\u2500\u2500 G\u0141OWICA (HEAD) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// Minecraft pickaxe head: poziomy prostok\u0105t z 2 z\u0119bami na g\u00f3rze
// Korpus: szeroki poziomo, cienki pionowo
const HEAD_W = 3.2 * S;
const HEAD_H = 0.7 * S;
const HEAD_D = 0.55 * S;
const HEAD_Y = 0.8 * S;
const HEAD_X = -0.3 * S; // lekko przesuni\u0119ty w lewo wzgl\u0119dem trzonka

// Korpus g\u0142\u00f3wny g\u0142owicy
makeBox(HEAD_W, HEAD_H, HEAD_D,  HEAD_X, HEAD_Y, 0,  0xcc00ff, 0xff00aa, 'x');

// Lewy z\u0105b (g\u00f3rny)
makeBox(0.65*S, 0.75*S, HEAD_D,  HEAD_X - 1.05*S, HEAD_Y + 0.72*S, 0,  0xee44ff, 0xbb00dd, 'y');

// Prawy z\u0105b (g\u00f3rny)
makeBox(0.65*S, 0.75*S, HEAD_D,  HEAD_X + 0.75*S, HEAD_Y + 0.72*S, 0,  0xdd00ff, 0xff00cc, 'y');

// Lewy koniec g\u0142owicy (ostry, troch\u0119 d\u0142u\u017cszy w d\u00f3\u0142)
makeBox(0.5*S, 0.55*S, HEAD_D,  HEAD_X - 1.55*S, HEAD_Y - 0.25*S, 0,  0xaa00ee, 0x880099, 'y');

// Prawy koniec g\u0142owicy
makeBox(0.45*S, 0.55*S, HEAD_D,  HEAD_X + 1.3*S, HEAD_Y - 0.25*S, 0,  0xcc00ff, 0x9900bb, 'y');

// \u2500\u2500 Edge glow strip na kraw\u0119dziach ostrzy \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function makeEdge(w, h, d, x, y, z) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, matEdge);
  m.position.set(x, y, z);
  pickaxe.add(m);
}
// kraw\u0119d\u017a lewa ostrze
makeEdge(0.04, 0.75*S, HEAD_D+0.02,  HEAD_X - 1.38*S, HEAD_Y + 0.72*S, 0);
// kraw\u0119d\u017a prawa ostrze
makeEdge(0.04, 0.75*S, HEAD_D+0.02,  HEAD_X + 1.08*S, HEAD_Y + 0.72*S, 0);
// kraw\u0119d\u017a g\u00f3rna korpusu
makeEdge(HEAD_W+0.02, 0.04, HEAD_D+0.02,  HEAD_X, HEAD_Y + HEAD_H/2, 0);
// kraw\u0119d\u017a dolna korpusu
makeEdge(HEAD_W+0.02, 0.04, HEAD_D+0.02,  HEAD_X, HEAD_Y - HEAD_H/2, 0);

// \u2500\u2500\u2500 TRZONEK (HANDLE) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// Obr\u00f3cony pod k\u0105tem -45\u00b0 (diagonal jak w MC)
const STICK_LEN = 3.8 * S;
const STICK_W   = 0.32 * S;

const stickGeo = new THREE.BoxGeometry(STICK_W, STICK_LEN, STICK_W);
const stickMesh = new THREE.Mesh(stickGeo, matStick);
// Obr\u00f3\u0107 -45\u00b0 i przesu\u0144 tak \u017ceby \u0142\u0105czy\u0142 si\u0119 z g\u0142owic\u0105
stickMesh.rotation.z = Math.PI / 4; // 45\u00b0
stickMesh.position.set(0.85*S, -0.55*S, 0);
stickMesh.castShadow = true;
pickaxe.add(stickMesh);

// Koniec trzonka - ma\u0142y blok
const endGeo = new THREE.BoxGeometry(0.38*S, 0.38*S, 0.38*S);
const endMesh = new THREE.Mesh(endGeo, new THREE.MeshStandardMaterial({
  color: 0x1a0030, roughness: 0.5, metalness: 0.7
}));
endMesh.position.set(
  0.85*S + Math.sin(Math.PI/4)*(STICK_LEN/2 - 0.15),
  -0.55*S - Math.cos(Math.PI/4)*(STICK_LEN/2 - 0.15),
  0
);
pickaxe.add(endMesh);

// \u2500\u2500\u2500 NAPIS "OLIWIERTAS" NA G\u0141OWICY \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// Generujemy przez Canvas2D i mapujemy jako texture na p\u0142aski quad

function makeTextSprite(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');

  // T\u0142o transparentne
  ctx.clearRect(0, 0, 512, 128);

  // Gradient tekstu
  const grad = ctx.createLinearGradient(0, 0, 512, 0);
  grad.addColorStop(0,   '#ffffff');
  grad.addColorStop(0.3, '#ffaaff');
  grad.addColorStop(0.6, '#ffffff');
  grad.addColorStop(1,   '#eeaaff');

  // Cie\u0144 / glow
  ctx.shadowColor = '#cc00ff';
  ctx.shadowBlur = 18;

  ctx.font = 'bold 72px "Arial Black", Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Outline czarny
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.lineWidth = 10;
  ctx.strokeText(text, 256, 64);

  // Fill gradient
  ctx.fillStyle = grad;
  ctx.fillText(text, 256, 64);

  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;

  const geo = new THREE.PlaneGeometry(HEAD_W * 0.95, 0.45 * S);
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  // Umieszcz NA g\u0142owicy \u2014 lekko przed ni\u0105 (z+)
  mesh.position.set(HEAD_X, HEAD_Y, HEAD_D/2 + 0.02);
  return mesh;
}

const textSprite = makeTextSprite('OLIWIERTAS');
pickaxe.add(textSprite);

// \u2500\u2500\u2500 EFEKT GLOW / BLOOM (emissive mesh za g\u0142owic\u0105) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const glowGeo = new THREE.PlaneGeometry(HEAD_W * 1.4, HEAD_H * 4);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0xaa00ff,
  transparent: true,
  opacity: 0.06,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
glowMesh.position.set(HEAD_X, HEAD_Y, -0.1);
pickaxe.add(glowMesh);

// \u2500\u2500\u2500 PARTICLES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const NPART = 120;
const partGeo = new THREE.BufferGeometry();
const ppos = [], pvel = [], pcol = [];
const pColors = [
  new THREE.Color(0xcc00ff), new THREE.Color(0xff00aa),
  new THREE.Color(0xff60ee), new THREE.Color(0x9900ff),
];
for (let i = 0; i < NPART; i++) {
  ppos.push((Math.random()-0.5)*14, (Math.random()-0.5)*10, (Math.random()-0.5)*8);
  pvel.push((Math.random()-0.5)*0.008, (Math.random()-0.5)*0.008, (Math.random()-0.5)*0.008);
  const c = pColors[Math.floor(Math.random()*pColors.length)];
  pcol.push(c.r, c.g, c.b);
}
partGeo.setAttribute('position', new THREE.Float32BufferAttribute(ppos, 3));
partGeo.setAttribute('color', new THREE.Float32BufferAttribute(pcol, 3));
const partMat = new THREE.PointsMaterial({ size: 0.07, vertexColors: true, transparent: true, opacity: 0.75 });
const parts = new THREE.Points(partGeo, partMat);
scene.add(parts);

// \u2500\u2500\u2500 INITIAL ROTATION \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
pickaxe.rotation.z = -Math.PI / 4; // kilof
